name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python-version: "3.9" }
          - { os: ubuntu-22.04, python-version: "3.10" }
          - { os: ubuntu-22.04, python-version: "3.11" }
          - { os: ubuntu-22.04, python-version: "3.12" }
          - { os: ubuntu-22.04, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test]
      - run: pytest -q
  oldest-numpy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install "numpy==1.22.4" pytest -e .
      - run: pytest -q
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: pip install dist/*.whl && superslim --version && python -c "import superslim; print(superslim.__version__)"
